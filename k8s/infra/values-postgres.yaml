auth:
  username: sasha
  password: secret-123
  database: app
primary:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: standard
  initdb:
    scripts:
      init.sql: |
        CREATE DATABASE registry;
        GRANT ALL PRIVILEGES ON DATABASE registry TO sasha;
  initContainers:
    - name: init-script
      image: busybox
      command: ["sh", "-c", "mkdir -p /bitnami/postgresql && chown -R 1001:1001 /bitnami/postgresql"]
      volumeMounts:
        - name: data
          mountPath: /bitnami/postgresql
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
service:
  type: ClusterIP
