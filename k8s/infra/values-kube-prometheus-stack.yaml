crds:
  enabled: true
  upgradeJob:
    enabled: false   # temporary value

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 2d
    retentionSize: 2GiB
    walCompression: true
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 3Gi

grafana:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.utz.local
  persistence:
    enabled: true
    type: pvc
    storageClassName: standard
    accessModes:
      - ReadWriteOnce
    size: 1Gi

prometheusOperator:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

alertmanager:
  enabled: false   # temporary value
