{{- if .Values.networkpolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "condenser-calculator.fullname" . }}
  labels:
    {{- include "condenser-calculator.labels" . | nindent 4 }}
spec:
  {{- toYaml .Values.networkpolicy.spec | nindent 2 }}
{{- end }}
