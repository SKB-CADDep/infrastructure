fullnameOverride: condenser-calculator

serviceAccount:
  create: false

frontend:
  replicaCount: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  image:
    repository: harbor.local/balance-plus/condenser-calculator-frontend
    pullPolicy: IfNotPresent
    tag: "1.0"
  resources:
    requests:
      cpu: 10m
      memory: 20Mi
    limits:
      cpu: 100m
      memory: 64Mi
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  service:
    type: ClusterIP
    port: 80
  volumes:
    - name: nginx-config
      configMap:
        name: condenser-calculator
  volumeMounts:
    - name: nginx-config
      mountPath: /etc/nginx/conf.d/default.conf
      subPath: default.conf

backend:
  replicaCount: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  image:
    repository: harbor.local/balance-plus/condenser-calculator-backend
    pullPolicy: IfNotPresent
    tag: "1.0"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 2000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  service:
    type: ClusterIP
    port: 80
  envFrom:
    - configMapRef:
        name: condenser-calculator-database
    - secretRef:
        name: condenser-calculator-database

job:
  enabled: true
  image:
    repository: harbor.local/balance-plus/condenser-calculator-backend
    pullPolicy: IfNotPresent
    tag: "1.0"
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: null
  completions: 1
  parallelism: 1
  restartPolicy: Never
  command:
    - /bin/sh
    - -c
  args:
    - |
      set -e
      alembic upgrade head
      python seed.py
  envFrom:
    - configMapRef:
        name: condenser-calculator-database
    - secretRef:
        name: condenser-calculator-database

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: condenser-calculator.utz.local
      paths:
        - path: /
          pathType: Prefix
          service:
            name: condenser-calculator-frontend
            port: 80

configmap:
  enabled: true
  data:
    default.conf: |
      server {
          listen 80;
          server_name _;
          root /usr/share/nginx/html;
          index index.html;

          location / {
              try_files $uri $uri/ /index.html;
          }

          location /api/ {
              proxy_pass http://condenser-calculator-backend/api/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
          }
      }

secret:
  enabled: false

networkpolicy:
  enabled: false
