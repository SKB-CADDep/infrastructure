fullnameOverride: condenser-calculator

serviceAccount:
  create: false

frontend:
  replicaCount: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  image:
    repository: harbor.local/balance-plus/condenser-calculator-frontend
    pullPolicy: IfNotPresent
    tag: "1.0"
  resources:
    requests:
      cpu: 10m
      memory: 20Mi
    limits:
      cpu: 100m
      memory: 64Mi
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  service:
    type: ClusterIP
    port: 80
  volumes:
    - name: nginx-config
      configMap:
        name: condenser-calculator
  volumeMounts:
    - name: nginx-config
      mountPath: /etc/nginx/conf.d/default.conf
      subPath: default.conf

backend:
  replicaCount: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  image:
    repository: harbor.local/balance-plus/condenser-calculator-backend
    pullPolicy: IfNotPresent
    tag: "1.1"
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  service:
    type: ClusterIP
    port: 80
  envFrom:
    - configMapRef:
        name: condenser-calculator
    - secretRef:
        name: condenser-calculator

job:
  enabled: true
  image:
    repository: harbor.local/balance-plus/condenser-calculator-backend
    pullPolicy: IfNotPresent
    tag: "1.1"
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: null
  completions: 1
  parallelism: 1
  restartPolicy: Never
  command:
    - /bin/sh
    - -c
  args:
    - |
      set -e
      echo "Applying Alembic migrations..."
      alembic upgrade head
      echo "Loading reference data..."
      python seed.py
  env:
    - name: POSTGRES_SERVER
      value: "postgres-postgresql.postgres.svc.cluster.local"
    - name: POSTGRES_PORT
      value: "5432"
    - name: POSTGRES_DB
      value: "condenser_calculator"
    - name: POSTGRES_USER
      value: "condenser"
    - name: POSTGRES_PASSWORD
      value: "super-secret-password"

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: condenser-calculator.local
      paths:
        - path: /
          pathType: Prefix
          service:
            name: condenser-calculator-frontend
            port: 80

configmap:
  enabled: true
  data:
    POSTGRES_SERVER: "postgres-postgresql.postgres.svc.cluster.local"
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "condenser_calculator"
    default.conf: |
      server {
          listen 80;
          server_name _;
          root /usr/share/nginx/html;
          index index.html;

          location / {
              try_files $uri $uri/ /index.html;
          }

          location /api/ {
              proxy_pass http://condenser-calculator-backend/api/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
          }
      }

secret:
  enabled: true
  data:
    POSTGRES_USER: "condenser"
    POSTGRES_PASSWORD: "super-secret-password"

networkpolicy:
  enabled: false
