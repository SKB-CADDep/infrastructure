apiVersion: v1
kind: Service
metadata:
  name: {{ include "valve-stems.fullname" . }}-backend
  labels:
    {{- include "valve-stems.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "valve-stems.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
