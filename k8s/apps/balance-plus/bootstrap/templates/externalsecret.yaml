{{- $root := . }}
{{- range $name, $service := .Values.services }}
{{- if and $service.enabled $service.externalSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $service.externalSecret.name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: balance-plus
    app.kubernetes.io/component: {{ $service.externalSecret.component | default "database" }}
spec:
  refreshInterval: {{ $root.Values.refreshInterval }}
  secretStoreRef:
    name: {{ $root.Values.secretStoreRef.name }}
    kind: {{ $root.Values.secretStoreRef.kind }}
  target:
    name: {{ $service.externalSecret.targetName }}
    creationPolicy: Owner
  data:
{{- range $item := $service.externalSecret.data }}
    - secretKey: {{ $item.secretKey }}
      remoteRef:
        key: {{ $service.externalSecret.remoteKey }}
        property: {{ $item.property }}
{{- end }}
{{- end }}
{{- end }}
