fullnameOverride: turbo-gant

global:
  imagePullSecrets:
    - name: harbor-pull-secret

replicaCount: 1
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  repository: cr.utz.ru/construct/turbo-gant
  pullPolicy: IfNotPresent
  tag: "1.0"

serviceAccount:
  create: false
  automount: false

envFrom:
  - configMapRef:
      name: turbo-gant-database
  - secretRef:
      name: turbo-gant-database

livenessProbe: {}
readinessProbe: {}
resources: {}

service:
  type: ClusterIP
  port: 80

configMap:
  enabled: true
  name: "turbo-gant-database"
  data:
    POSTGRES_USER: graphic
    POSTGRES_DB: mvp_graphics
    ADMIN_LOGIN: admin

externalSecret:
  enabled: true
  name: "turbo-gant-database"
  targetName: "turbo-gant-database"
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  remoteKey: apps/turbo-gant/dev/database
  data:
    - secretKey: POSTGRES_PASSWORD
      property: POSTGRES_PASSWORD
    - secretKey: ADMIN_PASSWORD
      property: ADMIN_PASSWORD
    - secretKey: SECRET_KEY
      property: SECRET_KEY
    - secretKey: DATABASE_URL
      property: DATABASE_URL

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: turbo-gant.utz.local
      paths:
        - path: /
          pathType: Prefix
