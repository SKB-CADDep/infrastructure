replicaCount: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "1.25"

imagePullSecrets: []

nameOverride: "test-app"
fullnameOverride: "test-app-full"

serviceAccount:
  create: true
  automount: false

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "80"

podLabels:
  app: test-app
  tier: backend

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: test-app

initContainers:
  - name: init-wait
    image: busybox:1.36
    command: ["sh", "-c", "echo init container running; sleep 2"]

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: test.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

envFrom:
  - configMapRef:
      name: test-config
  - secretRef:
      name: test-secret

startupProbe:
  httpGet:
    path: /
    port: 80
  failureThreshold: 30
  periodSeconds: 5

livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30

volumes:
  - name: config-volume
    configMap:
      name: test-config

volumeMounts:
  - name: config-volume
    mountPath: /etc/config

nodeSelector:
  disktype: ssd

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "test"
    effect: "NoSchedule"

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: test-app
        topologyKey: kubernetes.io/hostname

configmap:
  enabled: true
  data:
    APP_ENV: "production"
    DATABASE_URL: "postgres://user:password@hostname:5432/dbname"

secret:
  enabled: true
  data:
    DB_PASSWORD: "secret-123"

networkpolicy:
  enabled: true
  spec:
    podSelector:
      matchLabels:
        app: test-app
    policyTypes:
      - Ingress
      - Egress
    ingress:
      - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        podSelector:
          matchLabels:
            app.kubernetes.io/name: ingress-nginx
        ports:
          - protocol: TCP
            port: 80
    egress:
      - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres
          podSelector:
            matchLabels:
              kubernetes.io/name: postgresql
        ports:
          - protocol: TCP
            port: 5432
